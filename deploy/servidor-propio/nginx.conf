# Un solo dominio: el frontend y el API comparten origen (sin CORS).
# Reemplace tramites.unsa.edu.pe por el subdominio que asigne la OTI.

server {
  listen 80;
  server_name tramites.unsa.edu.pe;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name tramites.unsa.edu.pe;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Adjuntos: el límite real lo valida el API (MAX_FILE_MB); aquí un tope de seguridad.
  client_max_body_size 30m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;        # rutas de la SPA (React Router)
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  }
}
